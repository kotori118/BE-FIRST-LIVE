name: Build BE:LIVE app for Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'fixtures/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'app-entry.html'
      - '.github/workflows/build-app.yml'
permissions:
  contents: write
jobs:
  build-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated app for existing branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish BE:LIVE app [skip ci]"
            git push
          fi
